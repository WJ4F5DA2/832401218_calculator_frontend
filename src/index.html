<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>计算器 · 前后端分离</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="calculator" aria-label="计算器">
      <div class="display">
        <div id="expression" class="expression">&nbsp;</div>
        <div id="result" class="result">0</div>
      </div>
      <div id="error" class="error" role="alert"></div>
      <div class="keys" id="keys">
        <button class="key fn" data-action="clear">C</button>
        <button class="key fn" data-action="backspace">⌫</button>
        <button class="key op" data-value="(">(</button>
        <button class="key op" data-value=")">)</button>

        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key op" data-value="/">÷</button>

        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key op" data-value="*">×</button>

        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key op" data-value="-">−</button>

        <button class="key" data-value="0">0</button>
        <button class="key" data-value=".">.</button>
        <button class="key equals" data-action="equals">=</button>
        <button class="key op" data-value="+">+</button>
      </div>
    </section>

    <section class="history" aria-label="计算历史">
      <header class="history-header">
        <h2>计算历史</h2>
        <div class="history-actions">
          <button id="refresh-history" class="small-btn" type="button">刷新</button>
          <button id="clear-history" class="small-btn danger" type="button">清空</button>
        </div>
      </header>
      <ul id="history-list" class="history-list">
        <li class="history-empty">暂无历史记录</li>
      </ul>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
